# Render service id: srv-d81gv0po3t8c73ek2g9g
# Expected Render URL: https://nicolasquipaie.onrender.com
services:
  - type: web
    runtime: static
    name: nicolasquipaie
    buildCommand: dotnet publish src/Front/NicolasQuiPaieWeb/NicolasQuiPaieWeb.csproj -c Release -o src/Front/NicolasQuiPaieWeb/.render-publish /p:UseAppHost=false
    staticPublishPath: src/Front/NicolasQuiPaieWeb/.render-publish/wwwroot
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
